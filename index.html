<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>KAD KINGS</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="s-splash">
    <div class="splash-logo-wrap">
      <img
        src="logo.png"
        alt="KAD Kings logo"
        class="splash-logo"
        onerror="this.style.display='none';document.getElementById('splash-fallback').classList.remove('hidden')"
      >
      <div id="splash-fallback" class="splash-fallback hidden">KAD KINGS</div>
    </div>
    <div class="splash-sub">THE DRINKING CARD GAME</div>
  </div>

  <div class="lobby-stage">
    <div class="lobby-bg"></div>
    <div class="lobby-logo-bg"></div>
    <div class="lobby-vignette"></div>
  </div>

  <div id="s-lobby" class="screen layer-screen hidden">
    <div class="brand-hero">
      <img
        src="logo.png"
        alt="KAD Kings"
        class="brand-logo"
        onerror="this.style.display='none';document.getElementById('brand-fallback').classList.remove('hidden')"
      >
      <div id="brand-fallback" class="brand-logo-fallback hidden">
        <h1>KAD KINGS</h1>
        <p>THE DRINKING CARD GAME</p>
      </div>
    </div>

    <div class="panel lobby-card">
      <input id="i-name" class="inp lobby-name-input" placeholder="Your name">
      <button id="b-create" class="btn btn-ac lobby-create-btn">CREATE ROOM</button>

      <div class="lobby-divider">
        <div class="lobby-divider-line"></div>
        <span class="lobby-divider-text">OR JOIN</span>
        <div class="lobby-divider-line"></div>
      </div>

      <div class="lobby-join-row">
        <input
          id="i-code"
          class="inp lobby-code-input"
          placeholder="CODE"
          maxlength="5"
        >
        <button id="b-join" class="btn btn-s">JOIN</button>
      </div>

      <div id="lobby-status" class="lobby-status"></div>
    </div>
  </div>

  <div id="s-wait" class="screen layer-screen hidden">
    <div class="wait-brand">
      <img src="logo.png" alt="KAD Kings" onerror="this.style.display='none'">
    </div>

    <div class="float wait-crown">👑</div>
    <h2 class="wait-title">WAITING ROOM</h2>

    <div class="panel wait-room-code-card">
      <p class="wait-room-code-label">ROOM CODE</p>
      <span id="w-code" class="wait-room-code-value"></span>
    </div>

    <div class="wait-actions-row">
      <button id="b-invite" class="btn btn-s wait-action-btn">📤 Invite</button>
      <button id="b-fs" class="btn btn-dark wait-fullscreen-btn">⛶ Full</button>
    </div>

    <div id="w-status" class="wait-status"></div>

    <div class="panel wait-players-card">
      <p class="wait-players-label">👥 PLAYERS</p>
      <div id="w-players"></div>
    </div>

    <button id="b-start" class="btn btn-ac" disabled>NEED 2+ PLAYERS</button>
    <div class="small-note wait-solo-note">Solo start is allowed for testing.</div>
  </div>

  <div id="s-game" class="game-screen hidden">
    <div class="game-top-row">
      <span class="game-top-crown">👑</span>
      <div id="vid-strip" class="vid-strip game-vid-strip"></div>

      <div id="vid-ctrl-mini" class="game-video-controls">
        <button id="b-cam" class="btn btn-s game-cam-btn">📹</button>
      </div>

      <div id="g-conn" class="status-bar game-conn-bar"></div>
    </div>

    <div id="g-info" class="game-info-row">
      <span id="g-deck" class="chip"></span>
      <span id="g-kings" class="chip"></span>
      <div id="g-scores" class="game-scores-row"></div>
      <button id="b-inv2" class="btn btn-s game-invite-mini-btn">📤</button>
    </div>

    <div id="g-extra" class="game-extra-row"></div>

    <div id="g-main" class="game-main"></div>

    <div id="g-powers" class="game-powers-row">
      <div id="g-pw-list" class="game-powers-list"></div>
    </div>

    <div class="hidden">
      <div id="g-players"></div>
      <div id="g-mates-sec"></div>
      <div id="g-mates"></div>
      <div id="g-rules"></div>
      <div id="g-rules-list"></div>
      <div id="g-hist"></div>
    </div>
  </div>

  <div id="m-invite" class="ov hidden" onclick="if(event.target===this)this.classList.add('hidden')">
    <div class="panel invite-modal-card">
      <div class="invite-icon">📤</div>
      <h3 class="invite-title">Invite Friends</h3>
      <p class="invite-copy">Share this room code:</p>

      <div class="invite-code-box">
        <span id="m-code" class="invite-code-value"></span>
      </div>

      <button id="b-copy" class="btn btn-s">📋 Copy Invite</button>
      <br>
      <button id="b-close-invite" class="invite-close-btn">Close</button>
    </div>
  </div>

  <div id="ov-react" class="ov hidden">
    <div id="r-icon" class="reaction-icon"></div>
    <h2 id="r-title" class="reaction-title"></h2>
    <p id="r-by" class="reaction-by"></p>

    <div class="progress-track progress-track-reaction">
      <div id="r-bar" class="progress-fill progress-fill-accent progress-fill-fast"></div>
    </div>

    <div id="r-tap-area">
      <button id="r-tap" class="reaction-tap-btn">TAP!</button>
    </div>

    <div id="r-done" class="hidden reaction-done">
      <div class="reaction-done-icon">✅</div>
      <p class="reaction-done-text">Tapped!</p>
    </div>

    <p id="r-time" class="reaction-time"></p>
  </div>

  <div id="ov-results" class="ov hidden">
    <h2 class="results-title">RESULTS</h2>
    <div id="res-list" class="results-list"></div>
    <p id="res-loser" class="results-loser"></p>
    <button id="b-res-ok" class="btn btn-s">Continue</button>
  </div>

  <div id="ov-pick" class="ov hidden">
    <div id="pk-icon" class="pick-icon"></div>
    <h2 id="pk-title" class="pick-title"></h2>
    <p id="pk-label" class="pick-label"></p>
    <div id="pk-btns" class="pick-buttons"></div>
  </div>

  <div id="ov-timer" class="ov hidden">
    <div id="tm-icon" class="timer-icon"></div>
    <h2 id="tm-title" class="timer-title"></h2>
    <p id="tm-desc" class="timer-desc"></p>

    <div id="tm-clock" class="timer-clock">30</div>

    <div class="progress-track progress-track-timer">
      <div id="tm-bar" class="progress-fill progress-fill-gold progress-fill-medium"></div>
    </div>

    <p class="timer-help">When someone fails, tap their name:</p>
    <div id="tm-players" class="timer-players"></div>
    <button id="tm-skip" class="timer-skip-btn">Skip (no one failed)</button>
  </div>

  <div id="ov-drink" class="you-drink hidden">
    <div class="yd-inner" id="yd-text">YOU DRINK<br>🍺 +1</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
