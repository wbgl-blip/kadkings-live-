<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>KAD KINGS</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="fx-drink-flash" class="drink-flash hidden"></div>

  <div id="s-splash" class="screen splash-screen">
    <div class="splash-logo-wrap">
      <img
        src="logo.png"
        alt="KAD Kings logo"
        class="splash-logo"
        onerror="this.style.display='none';document.getElementById('fallback-crown').style.display='block';"
      >
      <div id="fallback-crown" class="fallback-crown hidden">👑</div>
    </div>
    <h1 class="splash-title">KAD KINGS</h1>
    <p class="splash-sub">PARTY HARD • ROCK ON</p>
  </div>

  <div id="s-lobby" class="screen hidden">
    <div class="lobby-brand">
      <div class="float lobby-crown">👑</div>
      <h1 class="lobby-title">KAD KINGS</h1>
      <p class="lobby-sub">THE DRINKING CARD GAME</p>
    </div>

    <div class="panel lobby-panel">
      <input id="i-name" class="inp" placeholder="Your name" autocomplete="off">

      <button id="b-create" class="btn btn-ac lobby-main-btn">CREATE ROOM</button>

      <div class="lobby-divider">
        <div></div>
        <span>OR JOIN</span>
        <div></div>
      </div>

      <div class="join-row">
        <input id="i-code" class="inp code-inp" placeholder="CODE" maxlength="5" autocomplete="off">
        <button id="b-join" class="btn btn-s">JOIN</button>
      </div>

      <div id="lobby-status" class="lobby-status"></div>
    </div>
  </div>

  <div id="s-wait" class="screen hidden">
    <div class="float wait-crown">👑</div>
    <h2 class="wait-title">WAITING ROOM</h2>

    <div class="panel wait-code-panel">
      <p class="wait-code-label">ROOM CODE</p>
      <span id="w-code" class="wait-code"></span>
    </div>

    <div class="wait-actions">
      <button id="b-invite" class="btn btn-s wait-action-btn">📤 Invite</button>
      <button id="b-fs" class="btn btn-dark wait-action-btn">⛶ Full</button>
    </div>

    <div id="w-status" class="wait-status"></div>

    <div class="panel wait-players-panel">
      <p class="wait-players-title">👥 PLAYERS</p>
      <div id="w-players"></div>
    </div>

    <button id="b-start" class="btn btn-ac wait-start-btn" disabled>NEED 2+ PLAYERS</button>
    <div class="small-note wait-note">Solo start is allowed for testing.</div>
  </div>

  <div id="s-game" class="hidden game-screen">
    <div class="game-topbar">
      <div class="game-top-left">👑</div>

      <div id="vid-strip" class="vid-strip"></div>

      <div id="vid-ctrl-mini" class="vid-ctrl-mini">
        <button id="b-cam" class="btn btn-s cam-btn">📹</button>
      </div>

      <div id="g-conn" class="status-bar game-conn"></div>
    </div>

    <div class="game-hud-row">
      <span id="g-deck" class="chip hud-chip"></span>
      <span id="g-kings" class="chip hud-chip"></span>
      <div id="g-scores" class="g-scores"></div>
      <button id="b-inv2" class="btn btn-s hud-invite-btn">📤</button>
    </div>

    <div id="g-active-powers" class="active-powers-row"></div>
    <div id="g-extra" class="extra-row"></div>

    <div id="g-main" class="game-main"></div>

    <div id="g-bottom-actions" class="game-bottom-actions">
      <div id="g-powers" class="g-powers hidden">
        <div id="g-pw-list" class="g-pw-list"></div>
      </div>
    </div>

    <div class="hidden">
      <div id="g-players"></div>
      <div id="g-mates-sec"></div>
      <div id="g-mates"></div>
      <div id="g-rules"></div>
      <div id="g-rules-list"></div>
      <div id="g-hist"></div>
    </div>
  </div>

  <div id="m-invite" class="ov hidden">
    <div class="panel invite-panel">
      <div class="invite-icon">📤</div>
      <h3 class="invite-title">Invite Friends</h3>
      <p class="invite-copy">Share this room code:</p>
      <div class="invite-code-wrap">
        <span id="m-code" class="invite-code"></span>
      </div>
      <button id="b-copy" class="btn btn-s">📋 Copy Invite</button>
      <button id="b-close-invite" class="modal-close-btn">Close</button>
    </div>
  </div>

  <div id="ov-react" class="ov hidden">
    <div id="r-icon" class="react-icon"></div>
    <h2 id="r-title" class="react-title"></h2>
    <p id="r-by" class="react-by"></p>

    <div class="progress-track">
      <div id="r-bar" class="progress-fill progress-fill-ac"></div>
    </div>

    <div id="r-tap-area">
      <button id="r-tap" class="react-tap-btn">TAP!</button>
    </div>

    <div id="r-done" class="hidden react-done">
      <div class="react-done-icon">✅</div>
      <p class="react-done-text">Tapped!</p>
    </div>

    <p id="r-time" class="react-time"></p>
  </div>

  <div id="ov-results" class="ov hidden">
    <h2 class="results-title">RESULTS</h2>
    <div id="res-list" class="results-list"></div>
    <p id="res-loser" class="results-loser"></p>
    <button id="b-res-ok" class="btn btn-s">Continue</button>
  </div>

  <div id="ov-pick" class="ov hidden">
    <div id="pk-icon" class="pick-icon"></div>
    <h2 id="pk-title" class="pick-title"></h2>
    <p id="pk-label" class="pick-label"></p>
    <div id="pk-btns" class="pick-buttons"></div>
  </div>

  <div id="ov-timer" class="ov hidden">
    <div id="tm-icon" class="timer-icon"></div>
    <h2 id="tm-title" class="timer-title"></h2>
    <p id="tm-desc" class="timer-desc"></p>

    <div id="tm-clock" class="timer-clock">30</div>

    <div class="progress-track progress-track-timer">
      <div id="tm-bar" class="progress-fill progress-fill-gd"></div>
    </div>

    <p class="timer-help">When someone fails, tap their name:</p>
    <div id="tm-players" class="timer-players"></div>
    <button id="tm-skip" class="timer-skip-btn">Skip (no one failed)</button>
  </div>

  <div id="ov-drink" class="you-drink hidden">
    <div class="yd-inner" id="yd-text">YOU DRINK<br>🍺 +1</div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
